<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickCare Admin</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-body">
<div id="login" class="login-wrap"><div class="login"><div class="logo">Quick<span>Care</span></div><h1>Admin Login</h1><p>Demo credentials: <b>admin</b> / <b>admin123</b></p><input id="loginUser" placeholder="Username"><input id="loginPass" type="password" placeholder="Password"><button class="btn full" onclick="adminLogin()">Login</button><a href="index.html">← Public website</a></div></div>
<div id="dashboard" class="hidden"><header class="top"><a class="logo" href="index.html">Quick<span>Care</span> <small>ADMIN</small></a><nav><a href="index.html">Public Site</a><button class="danger" onclick="logout()">Logout</button></nav></header>
<main class="admin-main"><div class="section-title"><div><small>CONTROL CENTER</small><h1>Dashboard</h1></div></div>
<div class="stats"><div><small>Total Orders</small><b id="sOrders">0</b></div><div><small>Revenue</small><b>₹<span id="sRevenue">0</span></b></div><div><small>Pending</small><b id="sPending">0</b></div><div><small>Products</small><b id="sProducts">0</b></div></div>
<section class="admin-card"><div class="section-title"><h2>Products</h2></div><form class="product-form" onsubmit="addProduct(event)"><input id="pName" required placeholder="Product name"><select id="pType"><option value="food">Food</option><option value="medicine">Medicine</option></select><input id="pPrice" type="number" min="1" required placeholder="Price"><input id="pEmoji" placeholder="Emoji"><button class="btn">+ Add</button></form><div id="productsTable"></div></section>
<section class="admin-card"><div class="section-title"><h2>Orders</h2><button class="ghost-btn" onclick="exportOrders()">Export CSV</button></div><div id="ordersTable"></div></section>
</main></div><script src="app.js"></script></body></html>
