<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickCare Admin</title><link rel="stylesheet" href="style.css"></head>
<body class="adminBody"><div id="login" class="login"><h1>Admin Login</h1><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><small>Demo: admin / admin123</small></div>
<div id="dashboard" hidden><header><div class="logo">QuickCare Admin</div><button onclick="logout()">Logout</button></header><main class="dash"><h1>Dashboard</h1><div class="stats"><div>Orders <b id="orders">0</b></div><div>Revenue <b id="revenue">₹0</b></div><div>Customers <b id="customers">0</b></div></div>
<section><h2>Add Product</h2><input id="pname" placeholder="Product name"><input id="price" type="number" placeholder="Price"><select id="category"><option>Food</option><option>Medicine</option></select><button onclick="addProduct()">Add Product</button></section>
<section><h2>Products</h2><div id="productList"></div></section><section><h2>Orders</h2><div id="orderList"></div></section></main></div><script src="app.js"></script></body></html>
